name: PracticalOps - render Pinterest PNGs
on:
  push:
    branches:
      - practicalops-pin-assets
    paths:
      - "practicalops/pins/*.svg"
      - ".github/workflows/practicalops-pin-render.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: practicalops-pin-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install SVG renderer
        run: |
          python -m pip install --disable-pip-version-check "cairosvg==2.7.1"
      - name: Rasterize original SVG assets
        run: |
          python - <<'PY'
          import pathlib, cairosvg
          for svg in sorted(pathlib.Path("practicalops/pins").glob("*.svg")):
              png = svg.with_suffix(".png")
              cairosvg.svg2png(url=str(svg), write_to=str(png), output_width=1000, output_height=1500)
              print(f"rendered {png} ({png.stat().st_size} bytes)")
          PY
      - name: Commit generated image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add practicalops/pins/*.png
          if git diff --cached --quiet; then
            echo "No PNG changes"
            exit 0
          fi
          git commit -m "Render PracticalOps Pinterest PNG assets [skip ci]"
          git push
