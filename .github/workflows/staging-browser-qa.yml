name: Webhook Retry Lab - staging browser QA
on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/qa-staging.mjs'
      - '.github/workflows/staging-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependency in CI only
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test existing staging site in real Chromium
        run: node scripts/qa-staging.mjs
